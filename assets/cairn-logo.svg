<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 400" width="100%" height="100%">
  <defs>
    <!-- Top Pebble Gradients -->
    <linearGradient id="cairn-top-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2562EB" />
    </linearGradient>
    <linearGradient id="cairn-top-inner" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Mid-Upper Stone Gradient -->
    <linearGradient id="cairn-mid-upper-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Mid-Lower Stone Gradient -->
    <linearGradient id="cairn-mid-lower-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="45%" stop-color="#2562EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Base Foundation Stone Gradient: Metallic/Pearl Stone with Blue Bounce -->
    <linearGradient id="cairn-base-grad" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="65%" stop-color="#64748B" />
      <stop offset="85%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#2562EB" />
    </linearGradient>
    
    <linearGradient id="cairn-base-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#2562EB" />
    </linearGradient>

    <!-- Filter for soft ambient glow -->
    <filter id="cairn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="cairn-stacked-stones">
    <!-- Ambient Glow beneath the Cairn -->
    <ellipse cx="256" cy="340" rx="200" ry="40" fill="#2562EB" opacity="0.25" filter="url(#cairn-glow)" />

    <!-- 4. BASE FOUNDATION STONE (Tier 4: Evidence & Audit) -->
    <!-- Lower shadow/depth layer of base stone -->
    <path d="M 90,270 C 130,245 380,240 435,275 C 475,300 460,345 390,355 C 310,365 140,360 80,335 C 40,318 60,285 90,270 Z" 
          fill="url(#cairn-base-bottom)" />
    <!-- Upper body and surface highlight of base stone -->
    <path d="M 95,268 C 145,242 360,240 415,270 C 445,286 425,320 370,330 C 275,346 140,340 85,315 C 55,302 65,280 95,268 Z" 
          fill="url(#cairn-base-grad)" />

    <!-- 3. MID-LOWER STONE (Tier 3: Execution & Dual Sandbox) -->
    <!-- Deep blue stone wedged above the base -->
    <path d="M 125,210 C 180,185 365,185 410,215 C 440,235 415,275 350,280 C 255,287 150,280 115,255 C 95,240 100,225 125,210 Z" 
          fill="url(#cairn-mid-lower-grad)" />

    <!-- 2. MID-UPPER STONE (Tier 2: Governance & Policy Engine) -->
    <!-- Glowing cyan-blue balancing stone -->
    <path d="M 175,150 C 215,130 335,130 365,155 C 390,175 370,210 320,215 C 240,222 170,215 155,195 C 145,180 155,160 175,150 Z" 
          fill="url(#cairn-mid-upper-grad)" />

    <!-- 1. TOP KEYSTONE (Tier 1: Intent & Ingress Gate) -->
    <!-- Slanted top balancing pebble with radiant highlight -->
    <path d="M 235,90 C 265,70 340,75 355,100 C 370,122 345,148 300,150 C 250,152 210,140 215,115 C 218,100 225,95 235,90 Z" 
          fill="url(#cairn-top-grad)" />
    <!-- Secondary top accent crest -->
    <path d="M 255,92 C 280,78 335,82 345,102 C 352,118 330,135 295,136 C 260,137 235,128 240,110 C 243,98 248,95 255,92 Z" 
          fill="url(#cairn-top-inner)" opacity="0.9" />
  </g>
</svg>
